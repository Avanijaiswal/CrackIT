{% extends "base.html" %}

{% block title %}Sign up - CrackIT{% endblock %}

{% block content %}
    <div class="auth-wrap">
        <div class="form-card">
            <h2>Create an account</h2>
            <p class="sub">It's free and only takes a minute.</p>

            {% if error %}
                <div class="alert">{{ error }}</div>
            {% endif %}

            <form method="post">
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-block">Create account</button>
            </form>

            <p class="form-foot">Already have an account? <a href="/login">Log in</a></p>
        </div>
    </div>
{% endblock %}
