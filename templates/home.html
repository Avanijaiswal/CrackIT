{% extends "base.html" %}

{% block title %}CrackIT - Home{% endblock %}

{% block content %}
    <section class="hero">
        <p class="eyebrow">Interview intelligence</p>
        <h1>Know what to expect before you walk in.</h1>
        <p class="sub">Real interview experiences, round breakdowns and topic trends for any company.</p>

        <form action="/experiences" method="get" class="search-box">

            <button type="submit">Search</button>
        </form>
    </section>
{% endblock %}
