{% extends "base.html" %}

{% block title %}Log in - CrackIT{% endblock %}

{% block content %}
    <div class="auth-wrap">
        <div class="form-card">
            <h2>Log in</h2>
            <p class="sub">Log in to share experiences, like and comment.</p>

            {% if error %}
                <div class="alert">{{ error }}</div>
            {% endif %}

            <form method="post">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-block">Log in</button>
            </form>

            <p class="form-foot">No account yet? <a href="/register">Sign up</a></p>
        </div>
    </div>
{% endblock %}
